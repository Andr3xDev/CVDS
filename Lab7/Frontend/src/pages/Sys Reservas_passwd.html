<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Contraseña</title>
    <link rel="stylesheet" href="../styles/styles_pwd.css">
    <link rel="stylesheet" href="../styles/menu_styles.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
</head>
<body>
    <div id="menu_container"></div>
    <div class="main-content">
        <div class="container">
            <!-- Header verde -->
            <header class="header">
                <div class="header-left">
                    <i id="open_button" class="menu-button fas fa-bars" aria-label="Menú"></i>
                    <div class="logo-container">
                        <div class="logo">
                            <img class="logo" src="../../assets/logo.png" alt="Logo">
                        </div>
                    </div>
                </div>
                <div class="header-right">
                    <h1>Gestión de Contraseña</h1>
                    <div class="user-name">
                        <h2>Rodrigo Gualtero</h2>
                    </div>
                </div>
            </header>
            
            <!-- Contenido principal -->
            <main class="main">
                <div class="card">
                    <div class="form-group">
                        <label for="current-password">Contraseña actual</label>
                        <div class="password-input-container">
                            <input type="password" id="current-password" class="input">
                            <button class="toggle-password" aria-label="Mostrar contraseña">
                                <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                                <svg class="eye-off-icon hidden" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
                                    <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
                                    <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
                                    <line x1="2" x2="22" y1="2" y2="22"></line>
                                </svg>
                            </button>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="new-password">Nueva contraseña</label>
                        <input type="password" id="new-password" class="input">
                    </div>
                    
                    <div class="form-group">
                        <label for="confirm-password">Confirmar nueva contraseña</label>
                        <input type="password" id="confirm-password" class="input">
                    </div>
                    
                    <div class="button-group">
                        <button id="change-password-btn" class="button primary-button">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path>
                            </svg>
                            Cambiar Contraseña
                        </button>
                        <button id="reset-password-btn" class="button secondary-button">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                                <path d="M3 3v5h5"></path>
                                <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path>
                                <path d="M16 21h5v-5"></path>
                            </svg>
                            Restablecer
                        </button>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="../menu_script.js"></script>
    <script src="../script_passwd.js"></script>
</body>
</html>
