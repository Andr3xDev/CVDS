<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salones</title>
    <link rel="stylesheet" href="../styles/styles_room.css">
    <link rel="stylesheet" href="../styles/menu_styles.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div id="menu_container"></div>
    <div class="main-content">
        <div class="container">
            <!-- Header verde -->
            <header class="header">
                <div class="header-left">
                    <i id="open_button" class="menu-button fas fa-bars" aria-label="Menú"></i>
                    <div class="logo-container">
                        <div class="logo">
                            <img class="logo" src="../../assets/logo.png">
                        </div>
                    </div>
                </div>
                <div class="header-right">
                    <h1>Salones</h1>
                    <div class="user-name">
                        <h2>Rodrigo Gualtero</h2>
                    </div>
                </div>
            </header>
            
            <!-- Contenido principal -->
            <main class="main">
                <div class="card">
                    <div class="selector-container">
                        <label for="bloque-select">Seleccione un bloque:</label>
                        <select id="bloque-select" class="select-input">
                            <option value="A">Bloque A</option>
                            <option value="B">Bloque B</option>
                            <option value="C">Bloque C</option>
                            <option value="D">Bloque D</option>
                        </select>
                    </div>
    
                    <div class="salones-grid" id="salones-container">
                        <!-- Los salones se cargarán dinámicamente aquí -->
                        <div class="button-group">
                            <button class="button" onclick="abrirModal('Laboratorio de Redes', 'Este laboratorio está equipado con routers y switches para prácticas de redes.')">Laboratorio de Redes</button>
                            <button class="button" onclick="abrirModal('Aula 201', 'Aula equipada con proyector y 30 asientos.')">Aula 201</button>
                            <button class="button" onclick="abrirModal('Aula 202', 'Espacio para clases teóricas con capacidad de 40 personas.')">Aula 202</button>
                            <button class="button" onclick="abrirModal('Aula 203', 'Sala de estudio con pizarras interactivas.')">Aula 203</button>
                        </div>
                    </div>
                    <!-- Añadido: Modal para mostrar información del aula -->
                    <div id="salon-modal" class="modal">
                        <div class="modal-content">
                            <span class="close-button">&times;</span>
                            <h3 id="modal-title">Información del Aula</h3>
                            <div id="modal-description"></div>
                       </div>
                    </div>
                </div>
            </main>
    
    
        </div>
    </div>
    <script src="../script_room.js"></script>
    <script src="../menu_script.js"></script>
</body>
</html>
